<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!-- Clinical chart grid: graph-paper rule with faint clinical line-art motifs.
       Tileable. Used as a low-opacity section background. -->
  <defs>
    <pattern id="minorgrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#181614" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="140" height="140" fill="url(#minorgrid)"/>
  <path d="M0 70H140M70 0V140" fill="none" stroke="#181614" stroke-width="0.8" stroke-opacity="0.75"/>

  <!-- tooth -->
  <g transform="translate(14 14)" fill="none" stroke="#A9573F" stroke-width="1.4"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <path d="M10 3c3.5 0 7 1.6 7 5.4 0 3.2-1.1 5.3-1.8 8.4-.5 2.3-.7 5-1.8 5-1.2 0-1.3-3.4-2.2-5.4-.3-.7-.7-1.1-1.2-1.1s-.9.4-1.2 1.1c-.9 2-1 5.4-2.2 5.4-1.1 0-1.3-2.7-1.8-5C5.1 13.7 4 11.6 4 8.4 4 4.6 7.5 3 11 3z"/>
  </g>

  <!-- pulse -->
  <g transform="translate(84 20)" fill="none" stroke="#A9573F" stroke-width="1.4"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <path d="M0 8h7l3-6 4 12 3-6h5"/>
  </g>

  <!-- cross -->
  <g transform="translate(20 84)" fill="none" stroke="#A9573F" stroke-width="1.4"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <path d="M9 2v14M2 9h14"/>
  </g>

  <!-- molecule -->
  <g transform="translate(84 84)" fill="none" stroke="#A9573F" stroke-width="1.3" opacity="0.45">
    <circle cx="4" cy="4" r="2.6"/><circle cx="15" cy="4" r="2.6"/><circle cx="9.5" cy="14" r="2.6"/>
    <path d="M6.2 5.2l6.6 7.6M13.4 5.4l-2.6 6.6M5.5 4h6.6" stroke-linecap="round"/>
  </g>
</svg>
