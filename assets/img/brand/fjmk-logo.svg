<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" width="440" height="150" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">FJMK logo</title>
  <desc id="d">Four-cell mark with one terracotta cell, followed by the FJMK wordmark and the line "Websites for clinics".</desc>
  <rect width="440" height="150" fill="#F4EFE7"/>
  <!-- Mark: 2x2 grid. Three ink cells, one terracotta cell = the booked slot -->
  <g>
    <rect x="28" y="36" width="34" height="34" rx="4" fill="#1F1B17"/>
    <rect x="66" y="36" width="34" height="34" rx="4" fill="#1F1B17"/>
    <rect x="28" y="74" width="34" height="34" rx="4" fill="#1F1B17"/>
    <rect x="66" y="74" width="34" height="34" rx="4" fill="#B5543A"/>
  </g>
  <!-- Wordmark -->
  <text x="120" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="50" letter-spacing="1" fill="#1F1B17">FJMK<tspan fill="#B5543A">.</tspan></text>
  <!-- Descriptor -->
  <text x="122" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="3" fill="#7A6444">WEBSITES FOR CLINICS</text>
</svg>
